<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Slide 2</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 1080px;
    height: 1350px;
    background: #FFD23F;
    font-family: Arial, "Segoe UI", sans-serif;
    color: #1B1B1B;
  }
  .slide {
    box-sizing: border-box;
    width: 1080px;
    height: 1350px;
    padding: 100px 90px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .numero {
    font-size: 40px;
    font-weight: 700;
    color: #1A5FB4;
    margin: 0 0 24px 0;
  }
  .titulo {
    font-size: 64px;
    font-weight: 700;
    line-height: 1.2;
    margin: 0 0 50px 0;
  }
  .corpo {
    font-size: 42px;
    line-height: 1.45;
    margin: 0;
  }
  .marca {
    position: absolute;
    bottom: 55px;
    right: 90px;
    font-size: 28px;
    font-weight: 700;
    color: #1B1B1B;
    opacity: 0.55;
  }
</style>
</head>
<body>
  <div class="slide">
    <p class="numero">1 / 5</p>
    <p class="titulo">Google cria "estagiário" de IA para casa</p>
    <p class="corpo">Agente experimental organiza calendário, treinos e refeições da família, com resumo todo dia de manhã. Só nos EUA, ainda em teste.</p>
  </div>
  <div class="marca">Radar de IA</div>
</body>
</html>
