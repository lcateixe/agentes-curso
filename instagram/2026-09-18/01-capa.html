<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Capa</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 1080px;
    height: 1350px;
    background: #FFD23F;
    font-family: Arial, "Segoe UI", sans-serif;
    color: #1B1B1B;
  }
  .slide {
    box-sizing: border-box;
    width: 1080px;
    height: 1350px;
    padding: 110px 100px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
  }
  .bar {
    width: 120px;
    height: 14px;
    background: #1A5FB4;
    border-radius: 7px;
    margin-bottom: 48px;
  }
  .frase {
    font-size: 84px;
    font-weight: 700;
    line-height: 1.18;
    margin: 0 0 40px 0;
  }
  .data {
    font-size: 44px;
    font-weight: 700;
    color: #1A5FB4;
    margin: 0;
  }
  .marca {
    position: absolute;
    bottom: 60px;
    right: 100px;
    font-size: 30px;
    font-weight: 700;
    color: #1B1B1B;
    opacity: 0.55;
  }
</style>
</head>
<body>
  <div class="slide">
    <div class="bar"></div>
    <p class="frase">IA já organiza sua casa, seu código e seu quarto</p>
    <p class="data">18/09/2026</p>
  </div>
  <div class="marca">Radar de IA</div>
</body>
</html>
